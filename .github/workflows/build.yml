name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          { ./gradlew runDatagen --stacktrace && ./gradlew build --stacktrace; } 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: python3 .github/ci-report.py errors
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v5
        with:
          name: project-redacted-jar
          path: build/libs/*.jar
