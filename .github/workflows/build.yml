name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          { ./gradlew runDatagen --stacktrace && ./gradlew build --stacktrace; } 2>&1 | tee build.log
          test -f build/resources/client/projectredacted-client.txt
      - name: Report errors
        if: failure()
        run: python3 .github/ci-report.py errors
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Server smoke test
        run: |
          mkdir -p run/server && echo "eula=true" > run/server/eula.txt
          (sleep 5; echo stop) | timeout 300 ./gradlew runServer --args=nogui > smoke.log 2>&1 || true
          grep -q "projectredacted" smoke.log && grep -q "Done (" smoke.log || { python3 .github/ci-report.py smoke; exit 1; }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v5
        with:
          name: project-redacted-jar
          path: build/libs/*.jar
