name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          { ./gradlew runDatagen --stacktrace && ./gradlew build --stacktrace; } 2>&1 | tee build.log
          test -f build/resources/client/projectredacted-client.txt
      - name: Report errors
        if: failure()
        run: python3 .github/ci-report.py errors
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Probe APIs
        if: always()
        run: python3 .github/ci-report.py probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Server smoke test
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "site parts test\n%s\nsite parts live surface_flat\nsite parts live underground\nsite parts live surface_tall\nwait 100\nsite parts status\nsite parts expandtest\nwait 400\nsite parts status\n" "$(for i in 1 2 3; do for t in surface_flat underground surface_tall; do echo site parts test default $t; done; done)" > run/projectredacted-autotest.txt
          (sleep 5; echo stop) | timeout 480 ./gradlew runServer --args=nogui > smoke.log 2>&1 || true
          grep -q "projectredacted" smoke.log && grep -q "Done (" smoke.log || { python3 .github/ci-report.py smoke; exit 1; }
          python3 .github/ci-report.py parts || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: project-redacted-jar
          path: build/libs/*.jar
