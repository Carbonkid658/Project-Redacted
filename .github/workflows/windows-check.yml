name: windows-check
on: [push, workflow_dispatch]

permissions:
  contents: read
  checks: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: src-copy
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Copy to a path with spaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\scp mod- main" | Out-Null
          Copy-Item -Recurse "src-copy" "C:\scp mod- main\Project-Redacted-main"
      - name: Run server
        shell: bash
        working-directory: 'C:\scp mod- main\Project-Redacted-main'
        run: |
          mkdir -p run/server && echo "eula=true" > run/server/eula.txt
          (sleep 5; echo stop) | timeout 400 ./gradlew runServer --args=nogui > smoke.log 2>&1 || true
          cat .gradle/loom-cache/launch.cfg >> smoke.log 2>/dev/null || true
          GITHUB_SHA=$GITHUB_SHA python .github/ci-report.py smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
